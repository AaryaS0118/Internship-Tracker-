<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Side Quest — Summer 2027 Internship HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f6;--panel:#fff;--ink:#4a1737;--mut:#8a5a73;--line:#f1bfd4;--gold:#e83f8f;--goldbg:#ffe0ed;--ok:#168b68;--bad:#c33b62;--pin:#f8cddd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#351326;--panel:#541d3b;--ink:#fff1f7;--mut:#f2b8d0;--line:#8d3b61;--gold:#ff77b7;--goldbg:#6e294e;--ok:#7ee0a8;--bad:#ff9bb8;--pin:#8d3b61}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#351326;--panel:#541d3b;--ink:#fff1f7;--mut:#f2b8d0;--line:#8d3b61;--gold:#ff77b7;--goldbg:#6e294e;--ok:#7ee0a8;--bad:#ff9bb8;--pin:#8d3b61}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,6vw,42px);margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 10px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.sub{color:var(--mut);margin:4px 0 0}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:46px;height:46px;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#fff7fb;border:2px solid var(--line);border-radius:15px;box-shadow:0 5px 14px rgba(232,63,143,.13)}.brand-mark i{display:block;border-radius:5px;background:#f36ba8}.brand-mark i:nth-child(2){background:#dc3983}.brand-mark i:nth-child(3){background:#d7357d}.brand-mark i:nth-child(4){background:#f58fc0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700}
.stat small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.hero{background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:16px;display:grid;grid-template-columns:minmax(220px,1.1fr) 1fr;gap:16px;align-items:center}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.chip{width:100%;max-width:340px;margin:auto;display:block}
.pin{fill:var(--pin);transition:fill .3s,filter .3s}
.pin.on{fill:var(--gold);filter:drop-shadow(0 0 5px var(--gold))}
.xp{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.xp i{display:block;height:100%;background:var(--gold);transition:width .5s}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
input,select,textarea,button{font:inherit;color:inherit}
input,select{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.add input.url{flex:3 1 260px}.add input.role{flex:2 1 160px}
button{cursor:pointer;border:2px solid var(--ink);background:var(--gold);color:#1b1405;font-weight:700;border-radius:10px;padding:9px 16px}
button:hover{transform:translateY(-1px)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs{display:flex;gap:6px;margin:18px 0 12px;flex-wrap:wrap}
.tabs button{background:var(--panel);color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected=true]{background:var(--gold);color:#1b1405;border-color:var(--ink)}
.card{background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.Applied{border-left-color:#4a8fe0}.card.OA,.card.Interview{border-left-color:#b36be0}.card.Offer{border-left-color:var(--ok)}.card.Rejected{border-left-color:var(--bad);opacity:.7}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.card b{font-size:18px}
.card a{color:var(--mut);font-size:13px;word-break:break-all}
.refs{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.refs label{display:flex;gap:6px;align-items:center;cursor:pointer}
.empty{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--mut)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.panel a{color:var(--ok);font-weight:700}
.panel ul{margin:6px 0 0;padding-left:20px}
.tpl{width:100%;min-height:150px;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.note{background:var(--goldbg);border-radius:10px;padding:10px 12px;font-size:14px}
.cf{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall 2.2s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
@media(prefers-reduced-motion:reduce){.cf{display:none}*{transition:none!important}}
.fc{height:270px;margin-bottom:12px}.fi{height:100%;display:grid;transform-style:preserve-3d;transition:transform .6s}.ff,.fb{grid-area:1/1;min-height:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;margin:0!important;overflow-y:auto;overscroll-behavior:contain}.fc.flip .fi{transform:rotateY(180deg)}.fb{transform:rotateY(180deg);visibility:hidden;transition:visibility 0s .3s}.fc.flip .fb{visibility:visible}.fc.flip .ff{visibility:hidden;transition:visibility 0s .3s}
.card.Accepted{border-left-color:var(--ok)}.sum{margin:0 0 8px;color:var(--mut);font-style:italic}.fld{display:block;margin:8px 0;font-size:14px;color:var(--mut)}.fld input,.fld textarea{display:block;width:100%;margin-top:3px;color:var(--ink)}
.jobdesc{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:4px;color:var(--ink);max-height:190px;overflow:auto}
.button-link{display:inline-block;background:var(--gold);color:#1b1405!important;border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-weight:700;text-decoration:none}
.calendar-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.calendar-nav h2{margin:0;text-align:center;flex:1}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-weekday{text-align:center;color:var(--mut);font-size:12px;font-weight:700;padding:4px}.cal-day{min-height:72px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;overflow:hidden;cursor:pointer}.cal-day:hover,.cal-day.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--goldbg)}.cal-day.empty-day{background:transparent;border-color:transparent;cursor:default;box-shadow:none}.cal-day.today{border:2px solid var(--gold)}.cal-number{font-weight:800}.cal-dot{display:block;margin-top:5px;padding:2px 4px;border-radius:5px;background:var(--goldbg);color:var(--ink);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity-list{display:grid;gap:7px}.activity-item{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer}.activity-item:hover{outline:2px solid var(--gold)}.activity-date{min-width:92px;color:var(--mut);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}.activity-item b{display:block}.modal-backdrop{position:fixed;inset:0;background:rgba(74,23,55,.42);display:grid;place-items:center;padding:18px;z-index:20}.modal-card{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 18px 50px rgba(74,23,55,.25)}
.chip{display:inline-flex;gap:4px;align-items:center;border:2px solid var(--line);border-radius:20px;padding:2px 10px;margin:3px;font-size:14px}.chip.ok{border-color:var(--ok);color:var(--ok)}.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.mono-ta{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;min-height:280px}.mini{width:70px!important;display:inline-block!important}
.fc{touch-action:manipulation}.fc:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}.fc .ff,.fc .fb{-webkit-user-select:none;user-select:none}.fc input,.fc textarea{-webkit-user-select:text;user-select:text}.add textarea{flex:1 1 100%;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
 <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><h1>Side Quest</h1><p class="sub">Your hardware-internship command center for Summer 2027.</p></div></div>
 <div class="stats">
  <div class="stat mono" id="sDays">0<small>days to June 1, 2027</small></div>
  <div class="stat mono" id="sStreak">0<small>day streak</small></div>
  <div class="stat mono" id="sTotal">0<small>applied total</small></div>
 </div>
</div>

<section class="hero" aria-label="Today's progress">
 <svg class="chip" id="chip" viewBox="0 0 320 190" role="img" aria-label="Chip with pins lighting up as you apply"></svg>
 <div>
  <h2 id="lvl">Level 1</h2>
  <div class="xp"><i id="xpbar"></i></div>
  <p class="sub mono" id="xptxt"></p>
  <p id="msg" style="font-weight:700;margin:10px 0 4px"></p>
  <label class="sub">Daily goal <input id="goal" type="number" min="1" max="30" style="width:70px;padding:4px 8px"></label>
 </div>
</section>

<form class="add" id="addf" autocomplete="off">
 <input id="company" type="text" placeholder="Company name" required aria-label="Company name">
 <input class="role" id="role" type="text" placeholder="Job role" required aria-label="Job role">
 <input class="url" id="url" type="url" placeholder="Paste the job application link" required aria-label="Job link">
 <textarea id="jdadd" rows="4" placeholder="Paste the job description. The tracker will create a short skills-and-qualifications summary." required aria-label="Job description"></textarea>
 <button type="submit">Add job &amp; generate summary</button><span id="aim" class="sub" aria-live="polite"></span>
</form>

<div class="tabs" role="tablist">
 <button role="tab" data-t="t">Tracker</button>
 <button role="tab" data-t="h">History</button>
 <button role="tab" data-t="p">Projects &amp; experience</button>
 <button role="tab" data-t="s">Resume</button>
 <button role="tab" data-t="a">ChatGPT coach</button>
 <button role="tab" data-t="c">Compatibility</button>
 <button role="tab" data-t="d">Calendar</button>
 <button role="tab" data-t="q">Today’s quest</button>
 <button role="tab" data-t="r">Referral hub</button>
</div>
<div id="view"></div>
</div>

<script>
var $=function(s){return document.querySelector(s)};
var S;try{S=JSON.parse(localStorage.getItem('chipquest'))}catch(e){}
S=S||{apps:[],xp:0,goal:7,tab:'t'};S.resume=S.resume||'';S.bank=S.bank||[];S.me=S.me||{name:'',contact:'',edu:'',skills:''};S.gen=S.gen||{ne:3,np:3,nb:3};S.calMonth=S.calMonth||new Date().toISOString().slice(0,7);
var serverReady=false,serverSaveTimer=0;
S.apps.forEach(function(a){if(a.stage==='Offer')a.stage='Accepted';if(a.stage==='OA')a.stage='Interview';a.log=a.log||[];a.docs=a.docs||{}});
function companyName(a){
 var role=(a.role||'').toLowerCase();
 if(/mechanical engineer\s*[-–—]\s*hardware design intern/.test(role))return 'Nimble Robotics';
 if((a.company||'').toLowerCase()==='joinhandshake'&&/software\/computer engineering intern/i.test(a.role||''))return 'McKay';
 return a.company||'Company';
}
function jobSummary(a){
 var role=(a.role||'').toLowerCase();
 if(/mechanical engineer\s*[-–—]\s*hardware design intern/.test(role))return 'Design and prototype robotic hardware; support testing, cross-functional integration, DFM, sourcing, and documentation. Skills: CAD, GD&T, mechanism design, prototyping. Qualifications: pursuing BS/MS in mechanical engineering or a related field with hands-on build experience.';
 return a.sum||'';
}
function fixCompanyNames(){S.apps.forEach(function(a){var n=companyName(a);if(a.company!==n)a.company=n;var s=jobSummary(a);if(s&&(!a.sum||/^No description yet\.?$/i.test(a.sum)))a.sum=s})}
fixCompanyNames();
function save(){try{localStorage.setItem('chipquest',JSON.stringify(S))}catch(e){}
 if(serverReady){clearTimeout(serverSaveTimer);serverSaveTimer=setTimeout(syncServer,350)}}
async function syncServer(){try{await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state:S})})}catch(e){}}
async function loadServer(){try{var r=await fetch('/api/state');if(!r.ok)throw 0;var body=await r.json();serverReady=true;if(body.state){S=body.state;S.apps=S.apps||[];S.resume=S.resume||'';S.bank=S.bank||[];S.me=S.me||{name:'',contact:'',edu:'',skills:''};S.gen=S.gen||{ne:3,np:3,nb:3};S.calMonth=S.calMonth||new Date().toISOString().slice(0,7);S.apps.forEach(function(a){a.log=a.log||[];a.docs=a.docs||{};a.ref=a.ref||[0,0,0]});fixCompanyNames();save();draw()}else syncServer()}catch(e){serverReady=false}}
function today(){return new Date().toLocaleDateString('en-CA')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var STAGES=['Saved','Applied','Interview','Accepted','Rejected'];var FL={};
var LEVELS=[[0,'Transistor'],[40,'Logic Gate'],[120,'Flip-Flop'],[260,'State Machine'],[450,'ALU'],[700,'CPU Core'],[1000,'Tape-Out Hero']];

function guess(u){try{var x=new URL(u),h=x.hostname.replace(/^www\./,''),p=x.pathname.split('/').filter(Boolean);
 if(/greenhouse\.io|lever\.co|ashbyhq\.com|smartrecruiters\.com/.test(h)&&p[0])return cap(p[0]);
 if(/myworkdayjobs\.com|icims\.com|taleo\.net/.test(h))return cap(h.split('.')[0]);
 var l=h.split('.');l=l.filter(function(a){return !/^(careers|jobs|job|apply|boards|www)$/.test(a)});
 return cap(l.length>1?l[l.length-2]:l[0])}catch(e){return 'Company'}}
function cap(s){s=decodeURIComponent(s).replace(/[-_]/g,' ');return s.replace(/\b\w/g,function(c){return c.toUpperCase()})}

function appliedToday(){var t=today();return S.apps.filter(function(a){return a.applied===t}).length}
function streak(){var d=new Date(),n=0,set={};S.apps.forEach(function(a){if(a.applied)set[a.applied]=1});
 if(!set[d.toLocaleDateString('en-CA')])d.setDate(d.getDate()-1);
 while(set[d.toLocaleDateString('en-CA')]){n++;d.setDate(d.getDate()-1)}return n}
function level(){var i=0;LEVELS.forEach(function(l,k){if(S.xp>=l[0])i=k});return i}

function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 var e=['⚡','✨','🔧','💾','🎉'];for(var i=0;i<26;i++){var s=document.createElement('span');s.className='cf';s.textContent=e[i%5];
 s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(function(x){x.remove()},3200,s)}}

function chip(){var n=appliedToday(),g=S.goal,pins='',w=g>1?(240/(g-1)):0;
 for(var i=0;i<g;i++){var x=g>1?40+i*w:160;
  pins+='<rect class="pin'+(i<n?' on':'')+'" x="'+(x-7)+'" y="8" width="14" height="38" rx="3"/><rect class="pin'+(i<n?' on':'')+'" x="'+(x-7)+'" y="144" width="14" height="38" rx="3"/>'}
 $('#chip').innerHTML=pins+'<rect x="20" y="44" width="280" height="102" rx="12" fill="var(--ink)"/><circle cx="40" cy="64" r="5" fill="var(--bg)"/>'+
 '<text x="160" y="106" text-anchor="middle" font-size="40" font-weight="800" fill="var(--bg)" font-family="IBM Plex Mono,monospace">'+Math.min(n,99)+' / '+g+'</text>'+
 '<text x="160" y="130" text-anchor="middle" font-size="13" fill="var(--bg)" font-family="Bricolage Grotesque,sans-serif">applications today</text>'}

function head(){var n=appliedToday(),g=S.goal,L=level(),lo=LEVELS[L][0],hi=LEVELS[L+1]?LEVELS[L+1][0]:lo+1;
 $('#lvl').textContent='Level '+(L+1)+': '+LEVELS[L][1];
 $('#xpbar').style.width=(LEVELS[L+1]?Math.min(100,(S.xp-lo)/(hi-lo)*100):100)+'%';
 $('#xptxt').textContent=S.xp+' XP'+(LEVELS[L+1]?' · '+(hi-S.xp)+' to '+LEVELS[L+1][1]:' · max level');
 $('#goal').value=g;
 $('#sDays').firstChild.textContent=Math.max(0,Math.ceil((new Date(2027,5,1)-new Date())/864e5));
 $('#sStreak').firstChild.textContent=streak();
 $('#sTotal').firstChild.textContent=S.apps.filter(function(a){return a.applied}).length;
 $('#msg').textContent=n>=g?'Goal hit. Every pin is lit. Go touch grass.':n===0?'No pins lit yet. Apply to one and get the chip going.':(g-n)+' more to light the whole chip.';
 chip()}

function award(x){S.xp=Math.max(0,S.xp+x)}
function setStage(id,st){var a=S.apps.find(function(z){return z.id===id});if(!a)return;var before=appliedToday();
 a.stage=st;if(st==='Applied'&&!a.applied){a.applied=today();award(10)}
 if(st==='Interview'&&!a.iv){a.iv=1;award(15)}if(st==='Accepted'&&!a.of){a.of=1;award(50)}a.log=a.log||[];a.log.push({s:st,d:today()});
 save();draw();if(before<S.goal&&appliedToday()>=S.goal)confetti()}

var QUESTS=['digital design','RTL design','FPGA','embedded firmware','ASIC verification','hardware engineering','VLSI','computer architecture','embedded systems','SoC design','silicon validation','electrical engineering'];
function qlink(k,t){var q=encodeURIComponent(k+' intern summer 2027');
 return t==='li'?'https://www.linkedin.com/jobs/search/?keywords='+q+'&f_E=1':'https://www.google.com/search?q='+encodeURIComponent(k+' internship summer 2027 careers apply')}
function calendarEvents(){var out=[];S.apps.forEach(function(a){var logs=(a.log||[]).filter(function(l){return l.d});if(!logs.length&&a.added)logs=[{s:'Saved',d:a.added}];logs.forEach(function(l){var d=String(l.d||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d))out.push({id:a.id,date:d,status:l.s||'Activity',company:companyName(a),role:a.role||'Role not added',url:a.url})})});return out.sort(function(a,b){return b.date.localeCompare(a.date)})}
function applicationPopup(a){var d=a.docs||{},resume=d.resume||'No resume recorded';if(d.resumeFile&&d.resumeFile.key)resume+='<br><a href="'+fileHref(d.resumeFile)+'" target="_blank" rel="noopener">Open uploaded resume PDF</a>';var node=document.createElement('div');node.className='modal-backdrop';node.innerHTML='<div class="modal-card" role="dialog" aria-modal="true"><div class="row"><h2 style="margin:0">'+esc(companyName(a))+'</h2><button class="ghost" data-close-modal aria-label="Close">✕</button></div><p class="sub">'+esc(a.role||'Role not added')+'</p><hr style="border:0;border-top:1px solid var(--line)"><p><b>Application link</b><br><a href="'+esc(a.url||'#')+'" target="_blank" rel="noopener">Open job posting</a></p><p><b>Resume used</b><br>'+esc(d.resume||'No resume recorded')+(d.resumeFile&&d.resumeFile.key?'<br><a href="'+fileHref(d.resumeFile)+'" target="_blank" rel="noopener">Open uploaded resume PDF</a>':'')+'</p></div>';document.body.appendChild(node)}
function calendarUI(){
 var bits=(S.calMonth||new Date().toISOString().slice(0,7)).split('-'),y=+bits[0],m=+bits[1]-1,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),events=calendarEvents(),byDay={},selected=S.calSelected||today();
 events.forEach(function(e){if(e.date.slice(0,7)==S.calMonth)(byDay[e.date]||(byDay[e.date]=[])).push(e)});
 var label=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}),h='<div class="panel"><div class="calendar-nav"><button class="ghost" data-cal="prev" aria-label="Previous month">←</button><h2>'+label+'</h2><button class="ghost" data-cal="next" aria-label="Next month">→</button></div><div class="calendar-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return '<div class="calendar-weekday">'+d+'</div>'}).join('');
 for(var i=0;i<first;i++)h+='<div class="cal-day empty-day"></div>';
 for(var day=1;day<=days;day++){var key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),list=byDay[key]||[],todayKey=today(),items=list.slice(0,3).map(function(e){return '<span class="cal-dot">'+esc(e.status)+' · '+esc(e.company)+'</span>'}).join('');h+='<div class="cal-day'+(key===todayKey?' today':'')+(key===selected?' selected':'')+'" data-cal-date="'+key+'"><span class="cal-number">'+day+'</span>'+items+(list.length>3?'<span class="cal-dot">+'+(list.length-3)+' more</span>':'')+'</div>'}
 var selectedEvents=events.filter(function(e){return e.date===selected}),selectedLabel=new Date(selected+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
